# The merge gate on every platform Loopweft supports. Actions are pinned to the commit of a release at least
# two weeks old (the tag is in the comment), like every other dependency.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  # The one-file HTML in Safari, Apple's own WebKit, through the driver macOS ships with (tools/safari.ts):
  # nothing is downloaded. Its screens and report are kept as the run's "safari" artifact.
  safari:
    name: safari (macos-latest)
    runs-on: macos-latest
    # The checks take about two minutes; a wedged Safari or driver must not hold the runner for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo safaridriver --enable
      - run: node tools/safari.ts --out safari
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: safari
          path: safari
          if-no-files-found: error
